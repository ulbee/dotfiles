# ==============================================================================
# JSON Schema для POST /import/ (importForm endpoint)
#
# Описывает структуру JSON-документа, который принимает SurveyImportBuilder.
# Формат совпадает с тем, что возвращает GET /surveys/{id}/ (SurveyOut),
# но не все поля обязательны, и некоторые ведут себя иначе при импорте.
#
# Каждое поле задокументировано с точки зрения того, как оно используется
# при создании формы, какие дефолты применяются при отсутствии,
# и какие зависимости существуют между полями.
# ==============================================================================
$schema: "http://json-schema.org/draft-07/schema#"
title: ImportSurvey
description: >
  Входной документ для импорта формы. Создает полную копию формы
  со всеми вопросами, интеграциями, условиями и настройками.
  Формат повторяет SurveyOut (ответ GET /surveys/{id}/),
  поэтому экспортированную форму можно импортировать без изменений.
type: object
required:
  - version
properties:

  # ============================================================================
  # Метаданные формы
  # ============================================================================

  version:
    type: integer
    const: 2
    description: >
      Версия формата импорта. Должна быть ровно 2, иначе импорт
      будет отклонен ещё на этапе проверки (метод check()).

  name:
    type: string
    description: >
      Название формы, отображается в списке форм пользователя и
      в заголовке при заполнении. Если не задано или пустое,
      подставляется дефолт "Новая форма" (i18n ключ new_form).

  # ============================================================================
  # Поведение формы
  # ============================================================================

  allow_multiple_answers:
    type: boolean
    default: true
    description: >
      Разрешить одному пользователю заполнять форму несколько раз.
      По умолчанию true, поэтому если нужно ограничить одним ответом,
      нужно явно передать false.

  show_last_answer:
    type: boolean
    default: false
    description: >
      Подставлять предыдущий ответ пользователя в поля формы.
      Имеет смысл только при allow_multiple_answers: true,
      чтобы пользователь мог отредактировать свой ответ.

  iframe:
    type: boolean
    default: false
    description: >
      Ограничить публикацию формы только внутри iframe.
      Если true, форма не будет доступна по прямой ссылке.

  need_auth:
    type: boolean
    default: false
    description: >
      Требовать авторизацию для заполнения формы.
      Анонимные пользователи увидят экран логина перед формой.

  max_count:
    type:
      - integer
      - "null"
    description: >
      Максимальное количество ответов, после которого форма
      автоматически закрывается. null или отсутствие поля означает
      отсутствие лимита.

  follow:
    type:
      - string
      - "null"
    enum: ["5m", "1h", "1d", null]
    description: >
      Периодичность email-уведомлений об ошибках интеграций.
      Если не задано, уведомления отключены.
      - "5m": каждые 5 минут (для критичных интеграций)
      - "1h": каждый час (разумный баланс)
      - "1d": раз в день (для некритичных)

  captcha:
    type:
      - string
      - "null"
    enum: ["std", "ocr", "nbg", null]
    description: >
      Тип капчи перед отправкой формы. Если не задано, капча
      не показывается. Активация любого типа автоматически выставляет
      captcha_display_mode = "always".
      - "std": стандартная капча
      - "ocr": символьная капча (с распознаванием)
      - "nbg": невидимая капча (проверка поведения)

  metric:
    type:
      - integer
      - "null"
    description: >
      Номер счетчика Яндекс.Метрики. Если задан, будет привязан
      к форме для отслеживания просмотров и конверсии.

  validator_url:
    type:
      - string
      - "null"
    description: >
      URL внешнего валидатора вопросов. Перед сабмитом форма отправляет
      данные на этот URL и проверяет ответ. Позволяет реализовать
      серверную бизнес-логику валидации (например, проверку по внешней базе).

  file_storage:
    type:
      - string
      - "null"
    description: >
      Ссылка на пользовательское S3-совместимое файловое хранилище.
      Если задано, загруженные файлы будут храниться там, а не в
      дефолтном хранилище. Валидируется при импорте (проверяется
      доступность бакета).

  export_to_yt:
    type: boolean
    default: false
    description: >
      Экспортировать ответы формы в YT (Yandex Table).
      Работает только в связке с export_yt_path.

  export_yt_path:
    type:
      - string
      - "null"
    description: >
      Путь для экспорта ответов в YT. Формат: "cluster:path"
      (например, "hahn://home/forms/my_survey") или полный URL YT.
      Валидируется при импорте: проверяется формат пути и права
      пользователя на запись. Поддерживаемые кластеры определяются
      настройкой SUPPORTED_YT_CLUSTERS.

  # ============================================================================
  # Визуальные настройки и тексты
  # ============================================================================

  footer:
    type: boolean
    description: >
      Показывать футер на форме. Дефолт зависит от типа инсталляции:
      true для бизнес-сайтов, false для остальных.

  teaser:
    type: boolean
    description: >
      Показывать тизер (промо-блок). Дефолт зависит от типа инсталляции:
      true для бизнес-сайтов, false для остальных.

  stats:
    type: boolean
    default: false
    description: >
      Показывать статистику (сколько человек ответило) на странице
      после сабмита формы.

  share:
    type: boolean
    description: >
      Показывать кнопку "Поделиться формой" на странице после сабмита.
      Если не указано, используется дефолт системы (обычно true).

  fill_again:
    type: boolean
    description: >
      Показывать кнопку "Заполнить ещё раз" на странице после сабмита.
      Если не указано, используется дефолт системы (обычно true).

  texts:
    type: object
    description: >
      Тексты кнопок навигации и сообщения после отправки формы.
      Если весь объект или отдельные поля не заданы, подставляются
      i18n-дефолты на языке формы.
    properties:
      submit:
        type: string
        description: >
          Текст кнопки отправки формы на последней странице.
          Дефолт: "Отправить".
      back:
        type: string
        description: >
          Текст кнопки "Назад" для навигации между страницами.
          Дефолт: "Назад".
      next:
        type: string
        description: >
          Текст кнопки "Далее" для перехода на следующую страницу.
          Дефолт: "Далее".
      title:
        type: string
        description: >
          Заголовок на странице успешной отправки ответа.
          Дефолт: "Спасибо за ответ".
      subtitle:
        type: string
        description: >
          Подзаголовок на странице успешной отправки ответа.
          Дефолт: "Ваш ответ отправлен".

  styles:
    type: object
    description: >
      Настройки визуального оформления формы: цвета, шрифты, фоны.
      Если не заданы, используется стандартная тема.
    required:
      - custom
    properties:
      name:
        type:
          - string
          - "null"
        description: >
          Название стилевого шаблона. Если не задано,
          подставляется "Пользовательский шаблон".
      custom:
        type: object
        description: >
          Произвольный JSON-объект с CSS-переменными и настройками темы.
          Структура определяется фронтендом. Обязательное поле,
          если styles задан.
      images:
        type: object
        description: >
          Фоновые картинки для оформления формы.
        properties:
          page:
            $ref: "#/definitions/Image"
            description: >
              Картинка фона под основным контентом формы (задний план).
          form:
            $ref: "#/definitions/Image"
            description: >
              Картинка фона подложки формы (непосредственно за полями ввода).

  auto_publication:
    type: object
    description: >
      Настройки автоматического управления публикацией формы по расписанию.
      Позволяет открыть и/или закрыть форму в определенное время.
    properties:
      enabled:
        type: boolean
        default: false
        description: >
          Включить автоматическое управление публикацией.
          Без enabled: true остальные поля игнорируются.
      date_open:
        type:
          - string
          - "null"
        format: date-time
        description: >
          Дата и время автоматического открытия формы (ISO 8601).
          Если не задано, форма считается уже готовой к открытию.
      date_close:
        type:
          - string
          - "null"
        format: date-time
        description: >
          Дата и время автоматического закрытия формы (ISO 8601).
          Если не задано, форма не закрывается автоматически.

  # ============================================================================
  # Тесты и квизы
  # ============================================================================

  quiz:
    type: object
    description: >
      Настройки тестового/квиз-режима формы. Превращает обычную форму
      в тест с подсчетом баллов и показом результатов.
    properties:
      show_results:
        type: boolean
        default: false
        description: >
          Показывать общие результаты теста (набранные баллы,
          пройден/не пройден) после отправки формы.
      show_correct:
        type: boolean
        default: false
        description: >
          Показывать правильные ответы после отправки формы.
          Позволяет респонденту увидеть, где ошибся.
      calc_method:
        type: string
        enum: ["range", "scores"]
        default: "range"
        description: >
          Способ вычисления результата теста.
          - "range": результат определяется диапазоном баллов (items[])
          - "scores": результат это просто число набранных баллов
      pass_scores:
        type: number
        default: 0.0
        description: >
          Порог баллов для прохождения теста. Используется
          при calc_method "range" для определения пройден/не пройден.
      items:
        type: array
        default: []
        description: >
          Диапазоны для отображения различных результатов в зависимости
          от набранных баллов. Каждый элемент описывает текст и
          картинку для определенного диапазона.
        items:
          type: object
          properties:
            title:
              type: string
              description: >
                Заголовок результата. Обязателен.
                Дефолт: "Результат".
            description:
              type:
                - string
                - "null"
              description: >
                Развернутое описание результата (опционально).
            image:
              $ref: "#/definitions/Image"
              description: >
                Картинка для страницы результата (опционально).

  # ============================================================================
  # Редиректы
  # ============================================================================

  redirect:
    $ref: "#/definitions/Redirect"
    description: >
      Устаревшее поле для одного редиректа. Используйте redirects.
      Если задано redirects, поле redirect для настройки перенаправления
      игнорируется (но из redirect.button читается текст кнопки редиректа).
    deprecated: true

  redirects:
    type: array
    description: >
      Список редиректов. После отправки формы пользователь может быть
      перенаправлен на указанный URL или другую форму.
      Поддерживает условные редиректы (через conditions).
      Если не заданы, используется fallback на поле redirect.
    items:
      $ref: "#/definitions/Redirect"

  # ============================================================================
  # Вопросы и страницы
  # ============================================================================

  questions:
    type: object
    description: >
      Контейнер для вопросов формы. Форма разбита на страницы,
      каждая из которых отображается отдельным экраном при заполнении.
    required:
      - pages
    properties:
      pages:
        type: array
        description: >
          Массив страниц формы. Минимум одна страница должна быть.
          Нумерация позиций начинается с 1 и определяется порядком
          элементов в массиве.
        items:
          $ref: "#/definitions/Page"

  # ============================================================================
  # Условия отображения кнопки сабмита
  # ============================================================================

  conditions:
    type: array
    description: >
      Условия для кнопки отправки формы. Позволяют скрывать/показывать
      кнопку "Отправить" в зависимости от ответов на вопросы.
      Каждый элемент массива это группа условий (ConditionNode).
    items:
      $ref: "#/definitions/Condition"

  # ============================================================================
  # Интеграции (hooks + subscriptions)
  # ============================================================================

  hooks:
    type: array
    description: >
      Группы интеграций. Каждая группа (hook) содержит одну или несколько
      интеграций (subscriptions), которые выполняются после отправки
      формы. Группа может иметь собственные условия срабатывания.
    items:
      $ref: "#/definitions/Hook"

  # ============================================================================
  # Доступы и наблюдатели
  # ============================================================================

  access:
    type: array
    description: >
      Настройки доступов к форме. Определяют кто может редактировать
      форму, кто может заполнять, и кто может скачивать файлы.
      Обрабатывается только при миграции (migration=true).
    items:
      $ref: "#/definitions/Permission"

  followers:
    type: array
    description: >
      Список наблюдателей за ошибками интеграций. Получают уведомления
      с периодичностью, заданной в поле follow.
    items:
      $ref: "#/definitions/Follower"

# ==============================================================================
# Определения переиспользуемых типов
# ==============================================================================
definitions:

  # ============================================================================
  # Image: ссылка на картинку в аватарнице
  # ============================================================================
  Image:
    type: object
    description: >
      Картинка, хранящаяся в avatars (Яндекс Аватарница).
      При импорте из ссылки извлекается путь к файлу в хранилище.
    properties:
      name:
        type:
          - string
          - "null"
        description: >
          Оригинальное имя файла. Если не задано, генерируется
          автоматически (image_1, image_2 и т.д.).
      links:
        type: object
        description: >
          Словарь "размер" -> "URL картинки". Достаточно передать
          одну ссылку любого размера, из неё извлечётся путь
          к оригиналу. Ключ это суффикс размера (например, "orig").
        additionalProperties:
          type: string

  # ============================================================================
  # Page: страница формы с вопросами
  # ============================================================================
  Page:
    type: object
    description: >
      Страница формы. При заполнении каждая страница
      отображается отдельным экраном с навигацией "Назад"/"Далее".
    required:
      - items
    properties:
      items:
        type: array
        description: >
          Список вопросов на странице. Порядок в массиве определяет
          порядок отображения (позиция начинается с 1).
        items:
          $ref: "#/definitions/Question"
      conditions:
        type: array
        description: >
          Условия отображения всей страницы. Если условия не
          выполнены, страница пропускается при навигации.
        items:
          $ref: "#/definitions/Condition"

  # ============================================================================
  # Question: вопрос формы (polymorphic по полю type)
  # ============================================================================
  Question:
    type: object
    description: >
      Вопрос формы. Тип вопроса определяется полем type.
      В зависимости от типа доступны дополнительные поля.
    required:
      - type
    properties:
      # --- общие поля для всех типов вопросов ---
      type:
        type: string
        enum:
          - "string"
          - "boolean"
          - "integer"
          - "date"
          - "daterange"
          - "file"
          - "enum"
          - "suggest"
          - "matrix"
          - "comment"
          - "payment"
          - "series"
        description: >
          Тип вопроса. Определяет набор дополнительных полей,
          тип ожидаемого ответа и виджет отображения.
          - "string": текстовое поле (однострочное или многострочное)
          - "boolean": переключатель да/нет
          - "integer": поле для ввода целого числа
          - "date": выбор одной даты
          - "daterange": выбор диапазона дат
          - "file": загрузка файлов
          - "enum": выбор из списка вариантов (radio/checkbox/dropdown/stars/onerow)
          - "suggest": выбор из внешнего источника данных с автоподсказкой
          - "matrix": оценка по шкале (строки x столбцы)
          - "comment": текстовый блок без ввода (информационный)
          - "payment": поле оплаты через ЮMoney
          - "series": группа вложенных вопросов (контейнер)
      label:
        type:
          - string
          - "null"
        description: >
          Текст вопроса. Если не задан, подставляется дефолт
          "Новый вопрос". Отображается как заголовок вопроса.
      comment:
        type:
          - string
          - "null"
        description: >
          Подсказка под заголовком вопроса. Используется для
          пояснений ("Введите email в формате user@example.com").
          Дефолт: пустая строка.
      placeholder:
        type:
          - string
          - "null"
        description: >
          Текст-заполнитель внутри поля ввода (placeholder).
          Виден только пока поле пустое.
      slug:
        type:
          - string
          - "null"
        description: >
          Уникальный строковый идентификатор вопроса. Используется
          в условиях и переменных для ссылки на вопрос.
          Если не задан, генерируется автоматически как "{type}_{id}".
          Допустимые символы: латиница, цифры, дефис, подчеркивание.
      hidden:
        type: boolean
        default: false
        description: >
          Скрытый вопрос. Не отображается при заполнении,
          но может использоваться в условиях и интеграциях.
      image:
        $ref: "#/definitions/Image"
        description: >
          Картинка, отображаемая рядом с вопросом.
      conditions:
        type: array
        description: >
          Условия отображения вопроса. Если условия не выполнены,
          вопрос скрывается. Зависят от ответов на другие вопросы.
        items:
          $ref: "#/definitions/Condition"

      # --- поля для валидации (string, integer, date, daterange, file, enum, matrix, suggest, boolean, payment) ---
      validators:
        type: array
        description: >
          Список валидаторов для вопроса. Проверяют ответ
          пользователя перед отправкой формы.
        items:
          $ref: "#/definitions/Validator"

      # --- поля для type=string ---
      initial:
        description: >
          Начальное значение поля. Тип зависит от типа вопроса:
          string для "string", integer для "integer", boolean для "boolean",
          массив slug-ов вариантов для "enum" (list[string]).
      multiline:
        type: boolean
        default: false
        description: >
          Многострочное текстовое поле (textarea вместо input).
          Только для type="string". Влияет на тип хранения ответа:
          true -> answer_long_text, false -> answer_short_text.
      hint_source:
        type: object
        description: >
          Источник автоподсказок для текстового поля.
          Только для type="string".
        properties:
          name:
            type: string
            description: >
              Название источника данных для подсказок
              (например, тип QuestionLayerType).
          params:
            type: array
            description: >
              Параметры для фильтрации подсказок.
            items:
              $ref: "#/definitions/DataSourceParam"

      # --- поля для type=enum ---
      widget:
        type: string
        enum: ["radio", "checkbox", "dropdown", "stars", "onerow"]
        default: "radio"
        description: >
          Тип виджета для вопроса enum. Определяет визуальное
          представление и поведение.
          - "radio": переключатели (один ответ)
          - "checkbox": галочки (множественный выбор)
          - "dropdown": выпадающий список (один ответ)
          - "stars": рейтинг звездами (один ответ)
          - "onerow": горизонтальный выбор в одну строку (один ответ)
      items:
        type: array
        description: >
          Варианты ответов для type="enum" (массив Choice).
          Для type="series" содержит вложенные вопросы (массив Question).
        items:
          $ref: "#/definitions/Choice"
      modify_choices:
        type:
          - string
          - "null"
        enum: ["", "natural", "sort", "shuffle", null]
        description: >
          Модификация порядка вариантов ответов при отображении.
          Только для type="enum".
          - "" или null: без изменений (исходный порядок)
          - "natural": натуральная сортировка
          - "sort": алфавитная сортировка
          - "shuffle": случайный порядок при каждом показе
      show_first:
        type: boolean
        default: false
        description: >
          Показывать первый элемент в dropdown по умолчанию.
          Только для widget="dropdown". При false отображается
          плейсхолдер "Выберите".
      show_suggest:
        type: boolean
        description: >
          Показывать поле поиска по вариантам ответа.
          Только для type="enum".

      # --- поля для type=enum, тесты ---
      has_quiz:
        type: boolean
        description: >
          Включить тестовый режим для вопроса. При true варианты
          ответов (items) должны содержать поля correct и scores.
          Работает для type="enum" и type="string".
      quiz_items:
        type: array
        description: >
          Варианты ответов для теста. Только для type="string"
          с has_quiz=true. Для type="enum" баллы берутся из items[].
        items:
          type: object
          properties:
            label:
              type: string
              description: >
                Текст ответа, который считается правильным.
            correct:
              type: boolean
              default: true
              description: >
                Является ли данный вариант правильным.
            scores:
              type: number
              default: 0.0
              description: >
                Баллы за этот вариант ответа (макс. 1000000).

      # --- поля для type=suggest ---
      data_source:
        type: object
        description: >
          Источник данных для автоподсказок. Только для type="suggest".
          Определяет откуда брать варианты (сотрудники, города, трекер и т.д.).
        properties:
          name:
            type: string
            description: >
              Идентификатор источника данных (QuestionLayerType):
              "country", "city", "staff_login", "tracker_queue",
              "dir_user", "yt_table_source", "wiki_table_source" и др.
          params:
            type: array
            description: >
              Параметры для фильтрации данных. Например, фильтр
              по стране для источника "city".
            items:
              $ref: "#/definitions/DataSourceParam"
      multichoice:
        type: boolean
        default: false
        description: >
          Разрешить множественный выбор в suggest. Только для type="suggest".

      # --- поля для type=matrix ---
      rows:
        type: array
        description: >
          Строки матрицы (оцениваемые элементы). Только для type="matrix".
          Обязательно для matrix-вопросов.
        items:
          $ref: "#/definitions/MatrixTitle"
      columns:
        type: array
        description: >
          Столбцы матрицы (шкала оценки). Только для type="matrix".
          Обязательно для matrix-вопросов.
        items:
          $ref: "#/definitions/MatrixTitle"

      # --- поля для type=comment ---
      header:
        type: boolean
        default: false
        description: >
          Отображать текст как заголовок секции (крупный шрифт).
          Только для type="comment".

      # --- поля для type=payment ---
      account_id:
        type: string
        description: >
          Номер кошелька ЮMoney для приема оплаты.
          Обязательно для type="payment". Должен содержать
          только цифры, длина от 10 до 30 символов.
      fixed:
        type: boolean
        default: false
        description: >
          Фиксированная сумма оплаты (пользователь не может изменить).
          Только для type="payment".

      # --- поля для type=series ---
      # items (повторно):
      #   Для type="series" поле items содержит массив вложенных
      #   вопросов (любого типа кроме series). Вложенные вопросы
      #   отображаются как группа.

  # ============================================================================
  # Choice: вариант ответа для enum-вопросов
  # ============================================================================
  Choice:
    type: object
    description: >
      Вариант ответа для вопроса типа enum.
    properties:
      id:
        type:
          - integer
          - "null"
        description: >
          Идентификатор варианта ответа. Используется при миграции
          для сохранения связей. При обычном импорте генерируется
          автоматически.
      slug:
        type:
          - string
          - "null"
        description: >
          Строковый идентификатор варианта. Используется в условиях.
          Если не задан, используется строковое представление id.
      label:
        type: string
        description: >
          Текст варианта ответа. Дефолт: "Новый вариант".
      hidden:
        type: boolean
        default: false
        description: >
          Скрытый вариант. Не отображается при заполнении,
          но может быть предвыбран через initial.
      image:
        $ref: "#/definitions/Image"
        description: >
          Картинка для варианта ответа (опционально).
      correct:
        type:
          - boolean
          - "null"
        description: >
          Вариант является правильным (для тестового режима).
          Используется только при has_quiz=true.
      scores:
        type:
          - number
          - "null"
        description: >
          Баллы за выбор этого варианта (для тестового режима, макс. 1000000).
          Используется только при has_quiz=true.

  # ============================================================================
  # MatrixTitle: строка или столбец матрицы
  # ============================================================================
  MatrixTitle:
    type: object
    description: >
      Элемент матрицы (строка или столбец).
    properties:
      id:
        type:
          - integer
          - "null"
        description: >
          Идентификатор элемента. При обычном импорте генерируется
          автоматически.
      slug:
        type:
          - string
          - "null"
        description: >
          Строковый идентификатор элемента матрицы.
      label:
        type:
          - string
          - "null"
        description: >
          Текст элемента матрицы. Дефолт: "Новая строка" или
          "Новая колонка" в зависимости от типа.

  # ============================================================================
  # DataSourceParam: параметр для источника данных
  # ============================================================================
  DataSourceParam:
    type: object
    description: >
      Параметр фильтрации для источника данных (suggest, hint_source).
    properties:
      type:
        type: string
        description: >
          Тип параметра: "question" (значение берётся из ответа
          на другой вопрос), "country", "free_url" и др.
      value:
        type: string
        description: >
          Значение параметра. Для type="question" это slug вопроса.
          Для type="country" это geobase_id страны.
          Для type="free_url" это URL таблицы (YT или Wiki).

  # ============================================================================
  # Validator: правило валидации вопроса
  # ============================================================================
  Validator:
    type: object
    description: >
      Правило валидации ответа на вопрос. Набор допустимых type
      зависит от типа вопроса.
    required:
      - type
    properties:
      type:
        type: string
        enum:
          - "required"
          - "min"
          - "max"
          - "email"
          - "phone"
          - "url"
          - "inn"
          - "regexp"
          - "decimal"
          - "russian"
          - "count"
          - "size"
          - "single"
          - "external"
        description: >
          Тип валидации:
          - "required": поле обязательно для заполнения (все типы)
          - "min": минимальное значение/длина/дата (string, integer, date, daterange, payment)
          - "max": максимальное значение/длина/дата (string, integer, date, daterange, payment)
          - "email": ответ должен быть email-адресом (string)
          - "phone": ответ должен быть телефоном (string)
          - "url": ответ должен быть URL (string)
          - "inn": ответ должен быть ИНН (string)
          - "regexp": ответ должен соответствовать регулярному выражению (string)
          - "decimal": ответ должен быть дробным числом (string)
          - "russian": ответ должен содержать только кириллицу (string)
          - "count": максимальное количество файлов (file)
          - "size": максимальный размер файла в МБ (file, макс. 20)
          - "single": только один вариант ответа (enum)
          - "external": валидация через внешний URL, заданный в validator_url формы
      value:
        description: >
          Значение для валидации. Тип зависит от type валидатора:
          integer для min/max (string, integer), date строка для min/max (date),
          string для regexp, integer для size/count.
          Не требуется для required, email, phone, url, inn, decimal,
          russian, single, external.

  # ============================================================================
  # Condition: группа условий
  # ============================================================================
  Condition:
    type: object
    description: >
      Группа условий (ConditionNode). Условия внутри группы
      связаны оператором, заданным в первом элементе items.
      Несколько групп между собой связаны оператором OR.
    properties:
      items:
        type: array
        description: >
          Список условий внутри группы. Все элементы связаны
          одним оператором (AND или OR).
        items:
          $ref: "#/definitions/ConditionItem"

  # ============================================================================
  # ConditionItem: одно условие в группе
  # ============================================================================
  ConditionItem:
    type: object
    description: >
      Отдельное условие. Сравнивает значение (ответ на вопрос,
      язык или источник) с заданным значением.
    required:
      - type
      - condition
    properties:
      operator:
        type: string
        enum: ["and", "or"]
        default: "or"
        description: >
          Логический оператор связи с предыдущим условием в группе.
          - "and": текущее условие должно выполняться вместе с предыдущим
          - "or": достаточно выполнения одного из условий
      type:
        type: string
        enum: ["question", "language", "origin"]
        description: >
          Тип условия, определяет что сравнивается.
          - "question": сравнивается ответ на конкретный вопрос
          - "language": сравнивается язык респондента
          - "origin": сравнивается источник перехода (referer)
      condition:
        type: string
        enum: ["eq", "neq", "lt", "gt"]
        default: "eq"
        description: >
          Оператор сравнения.
          - "eq": равно
          - "neq": не равно
          - "lt": меньше (для числовых значений)
          - "gt": больше (для числовых значений)
      question:
        type:
          - string
          - "null"
        description: >
          Slug вопроса, ответ на который проверяется.
          Обязательно при type="question".
      value:
        type:
          - string
          - "null"
        maxLength: 100
        description: >
          Значение для сравнения. Для enum-вопросов это slug или id
          варианта ответа. Для текстовых вопросов это строка.
          Максимальная длина: 100 символов.

  # ============================================================================
  # Redirect: настройка перенаправления
  # ============================================================================
  Redirect:
    type: object
    description: >
      Настройка перенаправления после отправки формы.
      Можно перенаправить на внешний URL или на другую форму.
    properties:
      enabled:
        type: boolean
        default: true
        description: >
          Включен ли этот редирект. Отключенные редиректы
          сохраняются, но не срабатывают.
      url:
        type:
          - string
          - "null"
        description: >
          URL для перенаправления. Если задан next_survey,
          url может быть не задан.
      next_survey:
        type:
          - integer
          - string
          - "null"
        description: >
          Идентификатор другой формы для перенаправления.
          Тип: int или string (hex id) в зависимости от конфигурации.
          Альтернатива url: перенаправляет на другую форму.
      timeout:
        type: integer
        default: 5000
        description: >
          Таймаут перед перенаправлением в миллисекундах.
          Используется если with_delay=true.
      with_delay:
        type: boolean
        default: true
        description: >
          Использовать задержку перед перенаправлением.
          Если false, перенаправление происходит сразу.
      keep_iframe:
        type: boolean
        default: true
        description: >
          При открытии формы в iframe, перенаправление
          происходит внутри iframe (true) или в родительском
          окне (false).
      auto_redirect:
        type: boolean
        default: false
        description: >
          Автоматическое перенаправление после таймаута.
          Если false, пользователь должен нажать кнопку.
          На бизнес-сайтах всегда принудительно false.
      button:
        type:
          - string
          - "null"
        description: >
          Текст кнопки перенаправления. Читается из первого
          (или единственного) redirect. Дефолт: "Перейти".
      params:
        type: object
        description: >
          GET-параметры для URL перенаправления.
          Ключи и значения должны быть строками.
          В значениях можно использовать переменные ({variable_id}).
        additionalProperties:
          type: string
      conditions:
        type: array
        description: >
          Условия срабатывания редиректа. Позволяют
          перенаправлять на разные URL в зависимости от ответов.
        items:
          $ref: "#/definitions/Condition"
      variables:
        type: array
        description: >
          Переменные для вычисления значений GET-параметров
          редиректа. Переменные используются в params.
        items:
          $ref: "#/definitions/Variable"

  # ============================================================================
  # Hook: группа интеграций
  # ============================================================================
  Hook:
    type: object
    description: >
      Группа интеграций. Объединяет одну или несколько интеграций
      (subscriptions), которые выполняются вместе после отправки формы.
    properties:
      name:
        type:
          - string
          - "null"
        description: >
          Название группы. Дефолт: "Новая группа интеграций".
          Используется для навигации в интерфейсе управления.
      active:
        type: boolean
        default: true
        description: >
          Группа активна. Неактивные группы сохраняются,
          но не выполняются при отправке формы.
      conditions:
        type: array
        description: >
          Условия срабатывания всей группы интеграций.
          Если условия не выполнены, ни одна интеграция
          из группы не будет запущена.
        items:
          $ref: "#/definitions/Condition"
      subscriptions:
        type: array
        description: >
          Список интеграций в группе. Каждая интеграция
          определяется полем type и имеет свой набор параметров.
        items:
          $ref: "#/definitions/Subscription"

  # ============================================================================
  # Subscription: конкретная интеграция (polymorphic по полю type)
  # ============================================================================
  Subscription:
    type: object
    description: >
      Интеграция, выполняемая после отправки формы.
      Тип определяется полем type.
    required:
      - type
    properties:
      # --- общие поля для всех типов ---
      type:
        type: string
        enum: ["email", "tracker", "wiki", "jsonrpc", "post", "put", "http", "function"]
        description: >
          Тип интеграции:
          - "email": отправка письма
          - "tracker": создание тикета в Яндекс.Трекере
          - "wiki": запись на страницу/в таблицу Вики
          - "jsonrpc": JSON-RPC вызов
          - "post": HTTP POST с данными формы
          - "put": HTTP PUT с данными формы
          - "http": произвольный HTTP-запрос
          - "function": вызов облачной функции
      active:
        type: boolean
        default: true
        description: >
          Интеграция активна. Неактивные сохраняются, но не выполняются.
      follow:
        type: boolean
        default: false
        description: >
          Отслеживать результат работы интеграции.
          При ошибке пользователь получит уведомление (если настроен follow на уровне формы).
      language:
        type: string
        default: "from_request"
        description: >
          Язык рендеринга шаблонов интеграции. "from_request"
          берёт язык из запроса респондента. Также можно
          явно указать код языка ("ru", "en" и т.д.).
      variables:
        type: array
        description: >
          Переменные для шаблонизации полей интеграции.
          Используются в subject, body и других текстовых полях
          через синтаксис {variable_id}.
        items:
          $ref: "#/definitions/Variable"

      # --- поля для type=email ---
      subject:
        type:
          - string
          - "null"
        description: >
          Тема письма (email) или тикета (tracker).
          Поддерживает переменные {variable_id}.
          Дефолт: "Новая интеграция".
      body:
        type:
          - string
          - "null"
        description: >
          Текст письма (email), тикета (tracker), вики-страницы (wiki)
          или тело HTTP-запроса (http). Поддерживает переменные.
      email_to_address:
        type:
          - string
          - "null"
        description: >
          Адрес получателя письма. Обязательно для type="email".
          Несколько адресов через запятую. Поддерживает переменные.
      email_from_address:
        type:
          - string
          - "null"
        description: >
          Адрес отправителя письма. Только для type="email".
          На бизнес-сайтах игнорируется (используется системный).
          Поддерживает переменные.
      email_from_title:
        type:
          - string
          - "null"
        description: >
          Имя отправителя (отображаемое). Только для type="email".
          Поддерживает переменные.
      email_spam_check:
        type: boolean
        default: false
        description: >
          Проверять письмо на спам перед отправкой.
          Только для type="email". На бизнес-сайтах всегда true.
      headers:
        type: array
        description: >
          HTTP-заголовки для запросов (email, jsonrpc, http, post, put).
          Для email допустимы только Reply-To и заголовки, начинающиеся с "X-".
        items:
          $ref: "#/definitions/SubscriptionHeader"

      # --- поля для type=tracker ---
      queue:
        type:
          - string
          - "null"
        description: >
          Очередь трекера (например, "FORMS"). Обязательно для
          type="tracker" если не указан parent.
      parent:
        type:
          - string
          - "null"
        description: >
          Ключ родительского тикета (например, "FORMS-123").
          Обязательно для type="tracker" если не указан queue.
      author:
        type:
          - string
          - "null"
        description: >
          Логин автора тикета. Только для type="tracker".
          Поддерживает переменные.
      assignee:
        type:
          - string
          - "null"
        description: >
          Логин исполнителя тикета. Только для type="tracker".
          Поддерживает переменные.
      issue_type:
        type:
          - integer
          - "null"
        description: >
          Тип тикета в трекере (числовой id). Обязательно для type="tracker".
      priority:
        type:
          - integer
          - "null"
        description: >
          Приоритет тикета в трекере (числовой id). Обязательно для type="tracker".
      fields:
        type: array
        description: >
          Дополнительные поля тикета в трекере. Только для type="tracker".
        items:
          type: object
          properties:
            key:
              type: object
              required: [slug]
              description: >
                Ключ поля трекера.
              properties:
                slug:
                  type: string
                  description: >
                    Слаг поля трекера (обязательно).
                type:
                  type: string
                  default: "string"
                  description: >
                    Тип значения поля.
                name:
                  type:
                    - string
                    - "null"
                  description: >
                    Отображаемое имя поля. Дефолт: совпадает с slug.
            value:
              type:
                - string
                - "null"
              description: >
                Значение поля. Поддерживает переменные.
            only_with_value:
              type: boolean
              default: true
              description: >
                Отправлять поле только если значение не пустое.

      # --- поля для type=wiki ---
      supertag:
        type:
          - string
          - "null"
        description: >
          Супертег вики-страницы (путь). Обязательно для type="wiki".
          Может быть URL вики-страницы, из которого извлекается путь.
      grid_data:
        type: object
        description: >
          Описание таблицы для записи данных в вики-гриды.
          Только для type="wiki". Альтернатива текстовому body.
        properties:
          grid_id:
            type:
              - string
              - "null"
            description: >
              Идентификатор таблицы на вики-странице.
          title:
            type:
              - string
              - "null"
            description: >
              Заголовок таблицы.
          cols:
            type: array
            description: >
              Описание столбцов таблицы.
            items:
              type: object
              properties:
                key:
                  type: object
                  required: [slug, type]
                  properties:
                    slug:
                      type: string
                      description: >
                        Слаг столбца.
                    type:
                      type: string
                      description: >
                        Тип столбца.
                value:
                  type:
                    - string
                    - "null"
                  description: >
                    Значение для вставки. Поддерживает переменные.
      insert_to_begin:
        type: boolean
        default: false
        description: >
          Вставлять новую запись в начало страницы/таблицы.
          Только для type="wiki". При false добавляется в конец.

      # --- поля для type=jsonrpc ---
      url:
        type:
          - string
          - "null"
        description: >
          URL для HTTP-запроса. Обязательно для type="jsonrpc",
          "post", "put", "http". Поддерживает переменные.
      method:
        type:
          - string
          - "null"
        description: >
          Для type="jsonrpc": название RPC-метода (обязательно).
          Для type="http": HTTP-метод (get, post, patch, put, delete),
          дефолт "post".
      tvm_client:
        type:
          - string
          - "null"
        description: >
          ID TVM-клиента для сервисной авторизации.
          Только для type="jsonrpc", "post", "put", "http".
          Проверяется доступность через TVM при импорте.
      params:
        type: array
        description: >
          Для type="jsonrpc": параметры JSON-RPC вызова.
          Для type="function": параметры вызова облачной функции.
        items:
          $ref: "#/definitions/SubscriptionParam"

      # --- поля для type=post, type=put ---
      format:
        type: string
        enum: ["json", "xml"]
        default: "json"
        description: >
          Формат HTTP-запроса. Только для type="post" и "put".
      questions:
        type: object
        description: >
          Какие вопросы включать в тело запроса.
          Только для type="post" и "put".
        properties:
          all:
            type: boolean
            default: false
            description: >
              Включить все вопросы.
          items:
            type: array
            description: >
              Список slug-ов конкретных вопросов для включения.
              Используется при all=false.
            items:
              type: string

      # --- поля для type=function ---
      function_id:
        type:
          - string
          - "null"
        description: >
          Идентификатор облачной функции. Обязательно для type="function".

      # --- аттачи (email, tracker) ---
      attachments:
        type: object
        description: >
          Настройки вложений. Для type="email" и "tracker".
        properties:
          question:
            type: object
            description: >
              Прикрепить файлы из ответов на вопросы.
            properties:
              all:
                type: boolean
                default: false
                description: >
                  Прикрепить файлы из всех file-вопросов.
              items:
                type: array
                description: >
                  Slug-и вопросов, файлы из которых прикрепить.
                  Используется при all=false.
                items:
                  type: string
          static:
            type: array
            description: >
              Статические файлы для прикрепления. Указываются
              ссылками на файлы в хранилище.
            items:
              type: object
              properties:
                name:
                  type:
                    - string
                    - "null"
                  description: >
                    Имя файла.
                links:
                  type: object
                  description: >
                    Словарь со ссылками на файл. Из первой ссылки
                    извлекается путь (query-параметр ?path=).
                  additionalProperties:
                    type: string
          template:
            type: array
            description: >
              Шаблоны файлов для генерации вложений.
              Один шаблон может использоваться несколькими интеграциями.
            items:
              $ref: "#/definitions/AttachmentTemplate"

  # ============================================================================
  # SubscriptionHeader / SubscriptionParam
  # ============================================================================
  SubscriptionHeader:
    type: object
    description: >
      HTTP-заголовок для интеграции.
    required:
      - name
    properties:
      name:
        type: string
        maxLength: 255
        description: >
          Имя заголовка. Для email: только Reply-To или начинающиеся с "X-".
      value:
        type:
          - string
          - "null"
        maxLength: 500
        description: >
          Значение заголовка. Поддерживает переменные.
      only_with_value:
        type: boolean
        default: false
        description: >
          Отправлять заголовок только если значение не пустое.

  SubscriptionParam:
    type: object
    description: >
      Параметр для JSON-RPC или cloud function вызова.
    required:
      - name
    properties:
      name:
        type: string
        maxLength: 255
        description: >
          Имя параметра.
      value:
        type:
          - string
          - "null"
        maxLength: 500
        description: >
          Значение параметра. Поддерживает переменные.
      only_with_value:
        type: boolean
        default: false
        description: >
          Отправлять параметр только если значение не пустое.

  # ============================================================================
  # Variable: переменная для шаблонизации
  # ============================================================================
  Variable:
    type: object
    description: >
      Переменная для подстановки в текстовые поля интеграций.
      Ссылается на данные формы (ответы, мета-данные, внешние секреты).
      Используется через синтаксис {id} в subject, body и т.д.
    required:
      - id
      - type
    properties:
      id:
        type: string
        pattern: "^[a-fA-F\\d]{24}$"
        description: >
          Уникальный идентификатор переменной (24-символьный hex).
          При импорте id перемаппливается на новый,
          все ссылки {old_id} в текстах заменяются на {new_id}.
      type:
        type: string
        description: >
          Тип переменной (VariableTypes). Определяет источник данных.
          Примеры: "form.question_answer", "form.name", "request.header",
          "yav.secret", "form.questions_json" и др.
      renderer:
        type:
          - string
          - "null"
        description: >
          Тип рендеринга переменной (RendererTypes). Определяет
          формат вывода значения.
      filters:
        type: array
        description: >
          Фильтры обработки значения (FilterTypes).
          Применяются последовательно к результату переменной.
        items:
          type: string
      question:
        type:
          - string
          - "null"
        description: >
          Slug вопроса, из которого берётся значение.
          Обязательно для типов, начинающихся с "form.question_".
      questions:
        type: object
        description: >
          Список вопросов (для типов "form.questions_*").
        properties:
          all:
            type: boolean
            default: false
            description: >
              Использовать все вопросы формы.
          items:
            type: array
            description: >
              Slug-и конкретных вопросов. Используется при all=false.
            items:
              type: string
      only_with_value:
        type: boolean
        description: >
          Подставлять переменную только если значение не пустое.
      show_filenames:
        type: boolean
        description: >
          Для файловых переменных: выводить имена файлов вместо ссылок.
      name:
        type:
          - string
          - "null"
        description: >
          Имя для специальных типов переменных.
          Обязательно для "request.header", "request.query_param",
          "request.cookie", "yav.secret".
      secret:
        type:
          - string
          - "null"
        description: >
          Идентификатор секрета в YAV. Обязательно для type="yav.secret".
      version:
        type:
          - string
          - "null"
        description: >
          Версия секрета в YAV. Для type="yav.secret".

  # ============================================================================
  # AttachmentTemplate: шаблон файла
  # ============================================================================
  AttachmentTemplate:
    type: object
    description: >
      Шаблон файла для генерации вложений к интеграциям.
      Позволяет создавать PDF или текстовые файлы на основе
      данных формы.
    properties:
      id:
        type: integer
        description: >
          Идентификатор шаблона. Используется для дедупликации:
          если один шаблон прикреплён к нескольким интеграциям,
          достаточно передать одинаковый id.
      name:
        type: string
        description: >
          Имя шаблона файла. Дефолт: "Новый шаблон файла".
      body:
        type:
          - string
          - "null"
        description: >
          Текст шаблона. Поддерживает переменные {variable_id}.
      type:
        type: string
        enum: ["pdf", "txt"]
        default: "pdf"
        description: >
          Формат генерируемого файла.
          - "pdf": документ PDF
          - "txt": текстовый файл
      variables:
        type: array
        description: >
          Переменные для рендеринга шаблона файла.
        items:
          $ref: "#/definitions/Variable"

  # ============================================================================
  # Permission: настройка доступа к форме
  # ============================================================================
  Permission:
    type: object
    description: >
      Настройка доступа к форме. Определяет кто и что может
      делать с формой. Обрабатывается только при миграции.
    properties:
      action:
        type: string
        enum: ["change", "viewfile", "submit"]
        default: "change"
        description: >
          Тип действия, к которому применяется доступ.
          - "change": редактирование формы
          - "viewfile": просмотр загруженных файлов
          - "submit": заполнение формы
      access:
        type: string
        enum: ["owner", "restricted", "common", "public"]
        default: "owner"
        description: >
          Уровень доступа.
          - "owner": только владелец
          - "restricted": только указанные пользователи/группы
          - "common": все в организации (только для submit и viewfile)
          - "public": публичный доступ (только для submit и viewfile)
      users:
        type: array
        description: >
          Список пользователей для restricted-доступа.
        items:
          type: object
          properties:
            login:
              type:
                - string
                - "null"
            uid:
              type:
                - string
                - "null"
            cloud_uid:
              type:
                - string
                - "null"
            email:
              type:
                - string
                - "null"
      groups:
        type: array
        description: >
          Список групп для restricted-доступа.
        items:
          type: object
          properties:
            id:
              type: string
              description: >
                Идентификатор группы.
            name:
              type:
                - string
                - "null"
              description: >
                Название группы.

  # ============================================================================
  # Follower: наблюдатель за ошибками интеграций
  # ============================================================================
  Follower:
    type: object
    description: >
      Наблюдатель, получающий уведомления об ошибках интеграций.
    required:
      - type
    properties:
      type:
        type: string
        enum: ["user", "mail_list"]
        description: >
          Тип наблюдателя.
          - "user": конкретный пользователь (нужен uid или cloud_uid)
          - "mail_list": рассылка (нужен id)
      uid:
        type:
          - string
          - "null"
        description: >
          Паспортный uid пользователя. Для type="user".
          Обязательно uid или cloud_uid.
      cloud_uid:
        type:
          - string
          - "null"
        description: >
          Облачный uid пользователя. Для type="user".
          Обязательно uid или cloud_uid.
      email:
        type:
          - string
          - "null"
        description: >
          Email для уведомлений. Для type="user" опционально
          (берётся из профиля). Для type="mail_list" не используется.
      id:
        type:
          - string
          - "null"
        description: >
          Email рассылки. Для type="mail_list". Обязательно.
